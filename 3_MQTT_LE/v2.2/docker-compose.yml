version: "3.9"

services:
  controller-server:
    build: .
    container_name: controller_server
    ports:
      - "1243:1243"
      - "9524:9524"
    command: ["java", "--add-opens", "java.base/java.net=ALL-UNNAMED", "-cp", "lib/*:src", "ds.robot.http.ControllerServer"]

  controller-client:
    build: .
    container_name: controller_client
    depends_on:
      - controller-server
    command: ["./start-client.sh"]

  robot1:
    build: .
    container_name: robot1
    depends_on:
      - controller-server
    environment:
      - ROBOT_ID=R1
      - ROBOT_PORT=10001
      - CONTROLLER_HOST=controller-server
      - CONTROLLER_PORT=9524
    command: ["java", "--add-opens", "java.base/java.net=ALL-UNNAMED", "-cp", "src:lib/*", "ds.robot.rpc.RobotClient"]


